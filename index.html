<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Trade - Token Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Skeleton Loading Animation */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .skeleton {
            background: linear-gradient(90deg, #1a1a24 25%, #252532 50%, #1a1a24 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
            border-radius: 4px;
        }

        /* Price Change Animations */
        @keyframes priceUp {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(34, 197, 94, 0.2); }
        }

        @keyframes priceDown {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(239, 68, 68, 0.2); }
        }

        .price-flash-up {
            animation: priceUp 0.6s ease-in-out;
        }

        .price-flash-down {
            animation: priceDown 0.6s ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a24;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a5a;
        }

        /* Tooltip Styles */
        .tooltip {
            position: absolute;
            z-index: 1000;
            padding: 8px 12px;
            background: #1f1f2e;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tooltip.show {
            opacity: 1;
        }

        /* Popover Styles */
        .popover {
            position: absolute;
            z-index: 1001;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            min-width: 200px;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }

        .popover.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        /* Badge Styles */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-new {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-migrated {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .badge-final {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        /* Table Hover Effects */
        .table-row {
            border-bottom: 1px solid #1a1a24;
            transition: background-color 0.15s ease;
            cursor: pointer;
        }

        .table-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Chart Sparkline */
        .sparkline {
            width: 80px;
            height: 32px;
        }

        /* Pulse Animation for Live Data */
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-indicator {
            animation: pulse-dot 2s ease-in-out infinite;
        }

        /* Responsive Table */
        @media (max-width: 768px) {
            .hide-mobile {
                display: none;
            }
        }

        @media (max-width: 320px) {
            .table-container {
                font-size: 12px;
            }
        }

        /* Loading Bar */
        @keyframes loading-bar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #3b82f6;
            z-index: 3000;
            transform: translateX(-100%);
            animation: loading-bar 1.5s ease-in-out infinite;
        }

        /* Trend Indicators */
        .trend-up {
            color: #22c55e;
        }

        .trend-down {
            color: #ef4444;
        }

        /* Sort Icon */
        .sort-icon {
            display: inline-flex;
            flex-direction: column;
            margin-left: 4px;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .sort-icon.active {
            opacity: 1;
        }

        /* Status Dot */
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-active {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .status-warning {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
        }

        /* Progress Bar */
        .progress-bar {
            height: 4px;
            background: #1a1a24;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Tab Styles */
        .tab {
            padding: 10px 20px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: #6b7280;
        }

        .tab:hover {
            color: #9ca3af;
        }

        .tab.active {
            color: #ffffff;
            border-bottom-color: #3b82f6;
        }

        /* Card Styles */
        .card {
            background: #13131a;
            border: 1px solid #1f1f2e;
            border-radius: 8px;
            padding: 16px;
        }

        /* Blur Effect for Loading */
        .blur-load {
            filter: blur(4px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Loading Bar -->
    <div id="loadingBar" class="loading-bar" style="display: none;"></div>

    <!-- Main Container -->
    <div class="min-h-screen bg-[#0a0a0f]">
        <!-- Header -->
        <header class="border-b border-[#1a1a24] bg-[#0d0d12] sticky top-0 z-50">
            <div class="max-w-[1600px] mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-8">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center font-bold">A</div>
                            <span class="text-xl font-bold">Axiom Trade</span>
                        </div>
                        <nav class="hidden md:flex gap-6">
                            <a href="#" class="text-gray-400 hover:text-white transition">Trade</a>
                            <a href="#" class="text-white font-medium border-b-2 border-blue-500">Pulse</a>
                            <a href="#" class="text-gray-400 hover:text-white transition">Portfolio</a>
                        </nav>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 text-sm">
                            <span class="status-dot status-active live-indicator"></span>
                            <span class="text-gray-400">Live</span>
                        </div>
                        <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition">Connect Wallet</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-[1600px] mx-auto px-4 py-6">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div class="card">
                    <div class="text-gray-400 text-sm mb-1">Total Volume 24h</div>
                    <div class="text-2xl font-bold">$1,247,832</div>
                    <div class="text-green-500 text-sm mt-1">+12.5%</div>
                </div>
                <div class="card">
                    <div class="text-gray-400 text-sm mb-1">Active Pairs</div>
                    <div class="text-2xl font-bold">1,234</div>
                    <div class="text-green-500 text-sm mt-1">+23</div>
                </div>
                <div class="card">
                    <div class="text-gray-400 text-sm mb-1">New Listings</div>
                    <div class="text-2xl font-bold">47</div>
                    <div class="text-gray-400 text-sm mt-1">Last 24h</div>
                </div>
                <div class="card">
                    <div class="text-gray-400 text-sm mb-1">Avg. Market Cap</div>
                    <div class="text-2xl font-bold">$24.7K</div>
                    <div class="text-red-500 text-sm mt-1">-3.2%</div>
                </div>
            </div>

            <!-- Filters and Search -->
            <div class="card mb-6">
                <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between">
                    <div class="flex flex-wrap gap-2">
                        <button class="tab active" data-filter="all">All Tokens</button>
                        <button class="tab" data-filter="new">New Pairs</button>
                        <button class="tab" data-filter="final">Final Stretch</button>
                        <button class="tab" data-filter="migrated">Migrated</button>
                    </div>
                    <div class="flex gap-2 w-full lg:w-auto">
                        <div class="relative flex-1 lg:w-64">
                            <input 
                                type="text" 
                                id="searchInput"
                                placeholder="Search tokens..." 
                                class="w-full bg-[#1a1a24] border border-[#2a2a3a] rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500 transition"
                            >
                        </div>
                        <button id="filterBtn" class="px-4 py-2 bg-[#1a1a24] border border-[#2a2a3a] rounded-lg hover:bg-[#252532] transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Token Table -->
            <div class="card overflow-hidden">
                <div class="overflow-x-auto table-container">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-[#1a1a24]">
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400 cursor-pointer hover:text-white transition" data-sort="rank">
                                    #
                                    <span class="sort-icon">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 12 12"><path d="M6 3l4 4H2z"/></svg>
                                    </span>
                                </th>
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400 cursor-pointer hover:text-white transition" data-sort="name">
                                    Token
                                    <span class="sort-icon">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 12 12"><path d="M6 3l4 4H2z"/></svg>
                                    </span>
                                </th>
                                <th class="text-right py-4 px-4 text-sm font-semibold text-gray-400 cursor-pointer hover:text-white transition" data-sort="price">
                                    Price
                                    <span class="sort-icon">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 12 12"><path d="M6 3l4 4H2z"/></svg>
                                    </span>
                                </th>
                                <th class="text-right py-4 px-4 text-sm font-semibold text-gray-400 cursor-pointer hover:text-white transition hide-mobile" data-sort="change24h">
                                    24h %
                                    <span class="sort-icon">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 12 12"><path d="M6 3l4 4H2z"/></svg>
                                    </span>
                                </th>
                                <th class="text-right py-4 px-4 text-sm font-semibold text-gray-400 cursor-pointer hover:text-white transition hide-mobile" data-sort="volume">
                                    Volume
                                    <span class="sort-icon">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 12 12"><path d="M6 3l4 4H2z"/></svg>
                                    </span>
                                </th>
                                <th class="text-right py-4 px-4 text-sm font-semibold text-gray-400 cursor-pointer hover:text-white transition hide-mobile" data-sort="marketcap">
                                    Market Cap
                                    <span class="sort-icon">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 12 12"><path d="M6 3l4 4H2z"/></svg>
                                    </span>
                                </th>
                                <th class="text-center py-4 px-4 text-sm font-semibold text-gray-400 hide-mobile">
                                    Chart (7d)
                                </th>
                                <th class="text-center py-4 px-4 text-sm font-semibold text-gray-400">
                                    Status
                                </th>
                                <th class="text-right py-4 px-4 text-sm font-semibold text-gray-400">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Loading Skeletons -->
                            <tr class="table-row skeleton-row">
                                <td colspan="9" class="py-4 px-4">
                                    <div class="flex items-center gap-4">
                                        <div class="skeleton w-8 h-4"></div>
                                        <div class="skeleton w-8 h-8 rounded-full"></div>
                                        <div class="skeleton w-32 h-4"></div>
                                        <div class="skeleton w-20 h-4 ml-auto"></div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="border-t border-[#1a1a24] px-4 py-4 flex items-center justify-between">
                    <div class="text-sm text-gray-400">
                        Showing <span id="showingCount">0</span> of <span id="totalCount">0</span> tokens
                    </div>
                    <div class="flex gap-2">
                        <button id="prevPage" class="px-3 py-1 bg-[#1a1a24] border border-[#2a2a3a] rounded hover:bg-[#252532] transition disabled:opacity-50 disabled:cursor-not-allowed">
                            Previous
                        </button>
                        <button id="nextPage" class="px-3 py-1 bg-[#1a1a24] border border-[#2a2a3a] rounded hover:bg-[#252532] transition disabled:opacity-50 disabled:cursor-not-allowed">
                            Next
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Tooltip Container -->
    <div id="tooltip" class="tooltip"></div>

    <!-- Popover Container -->
    <div id="popover" class="popover"></div>

    <!-- Modal Container -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="modalContent">
            <!-- Dynamic content will be inserted here -->
        </div>
    </div>

    <script>
        // ==================== STATE MANAGEMENT ====================
        const state = {
            tokens: [],
            filteredTokens: [],
            currentFilter: 'all',
            currentSort: { field: 'marketcap', direction: 'desc' },
            currentPage: 1,
            itemsPerPage: 20,
            searchQuery: '',
            isLoading: true,
            priceUpdates: new Map(),
            websocketConnected: false
        };

        // ==================== DATA GENERATION ====================
        const tokenNames = [
            'BitCoin', 'Ethereum', 'Solana', 'Cardano', 'Polkadot', 'Avalanche', 'Chainlink',
            'Polygon', 'Uniswap', 'Cosmos', 'Algorand', 'VeChain', 'Theta', 'Filecoin',
            'Tron', 'Elrond', 'Tezos', 'Monero', 'EOS', 'Aave', 'Maker', 'Compound',
            'Curve', 'Synthetix', 'Yearn', 'SushiSwap', 'PancakeSwap', 'Bancor'
        ];

        const statusTypes = ['new', 'final', 'migrated', null];

        function generateMockToken(id) {
            const name = tokenNames[id % tokenNames.length] + (id > tokenNames.length ? ` ${Math.floor(id / tokenNames.length)}` : '');
            const symbol = name.substring(0, 4).toUpperCase();
            const price = Math.random() * 100;
            const change24h = (Math.random() - 0.5) * 50;
            const volume = Math.random() * 10000000;
            const marketcap = Math.random() * 100000000;
            const status = statusTypes[Math.floor(Math.random() * statusTypes.length)];
            
            return {
                id,
                rank: id + 1,
                name,
                symbol,
                price,
                change24h,
                volume,
                marketcap,
                status,
                chart: generateSparklineData(),
                liquidity: Math.random() * 5000000,
                holders: Math.floor(Math.random() * 100000),
                created: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000),
                contract: '0x' + Array(40).fill(0).map(() => Math.floor(Math.random() * 16).toString(16)).join('')
            };
        }

        function generateSparklineData() {
            const points = 20;
            const data = [];
            let value = 50 + Math.random() * 50;
            
            for (let i = 0; i < points; i++) {
                value += (Math.random() - 0.5) * 10;
                value = Math.max(10, Math.min(100, value));
                data.push(value);
            }
            
            return data;
        }

        function initializeTokens() {
            state.tokens = Array.from({ length: 150 }, (_, i) => generateMockToken(i));
            state.filteredTokens = [...state.tokens];
        }

        // ==================== WEBSOCKET SIMULATION ====================
        function startWebSocketSimulation() {
            state.websocketConnected = true;
            
            setInterval(() => {
                // Update random tokens
                const tokensToUpdate = Math.floor(Math.random() * 5) + 1;
                
                for (let i = 0; i < tokensToUpdate; i++) {
                    const randomIndex = Math.floor(Math.random() * state.tokens.length);
                    const token = state.tokens[randomIndex];
                    const oldPrice = token.price;
                    const priceChange = (Math.random() - 0.5) * 2;
                    token.price += priceChange;
                    token.price = Math.max(0.01, token.price);
                    
                    // Track price direction for animation
                    state.priceUpdates.set(token.id, {
                        direction: priceChange > 0 ? 'up' : 'down',
                        timestamp: Date.now()
                    });
                    
                    // Update visible row if exists
                    updateTokenRow(token);
                }
            }, 2000);
        }

        function updateTokenRow(token) {
            const row = document.querySelector(`tr[data-token-id="${token.id}"]`);
            if (!row) return;
            
            const priceCell = row.querySelector('.price-cell');
            const changeCell = row.querySelector('.change-cell');
            
            if (priceCell) {
                const update = state.priceUpdates.get(token.id);
                priceCell.textContent = formatPrice(token.price);
                priceCell.classList.remove('price-flash-up', 'price-flash-down');
                
                if (update) {
                    priceCell.classList.add(update.direction === 'up' ? 'price-flash-up' : 'price-flash-down');
                }
            }
        }

        // ==================== FORMATTING UTILITIES ====================
        function formatPrice(price) {
            if (price < 0.01) return `$${price.toFixed(6)}`;
            if (price < 1) return `$${price.toFixed(4)}`;
            return `$${price.toFixed(2)}`;
        }

        function formatVolume(volume) {
            if (volume >= 1000000) return `$${(volume / 1000000).toFixed(2)}M`;
            if (volume >= 1000) return `$${(volume / 1000).toFixed(2)}K`;
            return `$${volume.toFixed(2)}`;
        }

        function formatMarketCap(marketcap) {
            if (marketcap >= 1000000000) return `$${(marketcap / 1000000000).toFixed(2)}B`;
            if (marketcap >= 1000000) return `$${(marketcap / 1000000).toFixed(2)}M`;
            if (marketcap >= 1000) return `$${(marketcap / 1000).toFixed(2)}K`;
            return `$${marketcap.toFixed(2)}`;
        }

        function formatPercent(percent) {
            const sign = percent >= 0 ? '+' : '';
            return `${sign}${percent.toFixed(2)}%`;
        }

        function formatDate(date) {
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            return 'Just now';
        }

        // ==================== RENDERING ====================
        function renderSparkline(data) {
            const width = 80;
            const height = 32;
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            
            const points = data.map((value, index) => {
                const x = (index / (data.length - 1)) * width;
                const y = height - ((value - min) / range) * height;
                return `${x},${y}`;
            }).join(' ');
            
            const isPositive = data[data.length - 1] > data[0];
            const color = isPositive ? '#22c55e' : '#ef4444';
            
            return `
                <svg class="sparkline" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                    <polyline
                        points="${points}"
                        fill="none"
                        stroke="${color}"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            `;
        }

        function renderTokenRow(token) {
            const changeClass = token.change24h >= 0 ? 'trend-up' : 'trend-down';
            const statusBadge = token.status ? `<span class="badge badge-${token.status}">${token.status}</span>` : '<span class="text-gray-500 text-xs">Active</span>';
            
            return `
                <tr class="table-row" data-token-id="${token.id}" data-token-status="${token.status || 'active'}">
                    <td class="py-4 px-4 text-sm text-gray-400">${token.rank}</td>
                    <td class="py-4 px-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-sm">
                                ${token.symbol.charAt(0)}
                            </div>
                            <div>
                                <div class="font-semibold">${token.name}</div>
                                <div class="text-xs text-gray-400">${token.symbol}</div>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-4 text-right font-mono price-cell">${formatPrice(token.price)}</td>
                    <td class="py-4 px-4 text-right font-semibold ${changeClass} hide-mobile change-cell">
                        ${formatPercent(token.change24h)}
                    </td>
                    <td class="py-4 px-4 text-right text-sm text-gray-300 hide-mobile">
                        ${formatVolume(token.volume)}
                    </td>
                    <td class="py-4 px-4 text-right text-sm text-gray-300 hide-mobile marketcap-cell" data-tooltip="Market Cap: ${formatMarketCap(token.marketcap)}">
                        ${formatMarketCap(token.marketcap)}
                    </td>
                    <td class="py-4 px-4 text-center hide-mobile">
                        ${renderSparkline(token.chart)}
                    </td>
                    <td class="py-4 px-4 text-center">
                        ${statusBadge}
                    </td>
                    <td class="py-4 px-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-sm font-medium transition" onclick="handleTrade(${token.id})">
                                Trade
                            </button>
                            <button class="px-2 py-1 hover:bg-[#1a1a24] rounded transition info-btn" data-token-id="${token.id}">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const start = (state.currentPage - 1) * state.itemsPerPage;
            const end = start + state.itemsPerPage;
            const pageTokens = state.filteredTokens.slice(start, end);
            
            if (pageTokens.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="py-12 text-center text-gray-400">
                            <svg class="w-16 h-16 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-lg">No tokens found</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tableBody.innerHTML = pageTokens.map(token => renderTokenRow(token)).join('');
            
            // Update pagination
            document.getElementById('showingCount').textContent = Math.min(end, state.filteredTokens.length);
            document.getElementById('totalCount').textContent = state.filteredTokens.length;
            document.getElementById('prevPage').disabled = state.currentPage === 1;
            document.getElementById('nextPage').disabled = end >= state.filteredTokens.length;
            
            // Add event listeners for info buttons
            document.querySelectorAll('.info-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tokenId = parseInt(btn.dataset.tokenId);
                    showTokenModal(tokenId);
                });
            });
            
            // Add event listeners for row clicks
            document.querySelectorAll('.table-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (!e.target.closest('button')) {
                        const tokenId = parseInt(row.dataset.tokenId);
                        showTokenModal(tokenId);
                    }
                });
            });
            
            // Add tooltip listeners
            attachTooltipListeners();
        }

        // ==================== FILTERING & SORTING ====================
        function applyFilters() {
            let filtered = [...state.tokens];
            
            // Apply status filter
            if (state.currentFilter !== 'all') {
                filtered = filtered.filter(token => token.status === state.currentFilter);
            }
            
            // Apply search
            if (state.searchQuery) {
                const query = state.searchQuery.toLowerCase();
                filtered = filtered.filter(token => 
                    token.name.toLowerCase().includes(query) || 
                    token.symbol.toLowerCase().includes(query)
                );
            }
            
            // Apply sorting
            filtered.sort((a, b) => {
                const field = state.currentSort.field;
                const direction = state.currentSort.direction === 'asc' ? 1 : -1;
                
                if (field === 'name') {
                    return a.name.localeCompare(b.name) * direction;
                }
                
                return (a[field] - b[field]) * direction;
            });
            
            state.filteredTokens = filtered;
            state.currentPage = 1;
            renderTable();
        }

        function setFilter(filter) {
            state.currentFilter = filter;
            
            // Update tab UI
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.filter === filter) {
                    tab.classList.add('active');
                }
            });
            
            applyFilters();
        }

        function setSortField(field) {
            if (state.currentSort.field === field) {
                state.currentSort.direction = state.currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                state.currentSort.field = field;
                state.currentSort.direction = 'desc';
            }
            
            // Update sort icon UI
            document.querySelectorAll('[data-sort]').forEach(th => {
                const icon = th.querySelector('.sort-icon');
                if (th.dataset.sort === field) {
                    icon.classList.add('active');
                    icon.style.transform = state.currentSort.direction === 'asc' ? 'rotate(180deg)' : 'rotate(0deg)';
                } else {
                    icon.classList.remove('active');
                    icon.style.transform = 'rotate(0deg)';
                }
            });
            
            applyFilters();
        }

        // ==================== TOOLTIP ====================
        let tooltipTimeout;

        function attachTooltipListeners() {
            document.querySelectorAll('[data-tooltip]').forEach(element => {
                element.addEventListener('mouseenter', (e) => {
                    clearTimeout(tooltipTimeout);
                    const tooltip = document.getElementById('tooltip');
                    tooltip.textContent = element.dataset.tooltip;
                    
                    const rect = element.getBoundingClientRect();
                    tooltip.style.left = rect.left + rect.width / 2 + 'px';
                    tooltip.style.top = rect.top - 35 + 'px';
                    tooltip.style.transform = 'translateX(-50%)';
                    
                    tooltipTimeout = setTimeout(() => {
                        tooltip.classList.add('show');
                    }, 500);
                });
                
                element.addEventListener('mouseleave', () => {
                    clearTimeout(tooltipTimeout);
                    document.getElementById('tooltip').classList.remove('show');
                });
            });
        }

        // ==================== MODAL ====================
        function showTokenModal(tokenId) {
            const token = state.tokens.find(t => t.id === tokenId);
            if (!token) return;
            
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <div class="p-6">
                    <div class="flex items-start justify-between mb-6">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-2xl">
                                ${token.symbol.charAt(0)}
                            </div>
                            <div>
                                <h2 class="text-2xl font-bold">${token.name}</h2>
                                <p class="text-gray-400">${token.symbol}</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-[#0d0d12] p-4 rounded-lg">
                            <div class="text-sm text-gray-400 mb-1">Price</div>
                            <div class="text-xl font-bold">${formatPrice(token.price)}</div>
                        </div>
                        <div class="bg-[#0d0d12] p-4 rounded-lg">
                            <div class="text-sm text-gray-400 mb-1">24h Change</div>
                            <div class="text-xl font-bold ${token.change24h >= 0 ? 'text-green-500' : 'text-red-500'}">
                                ${formatPercent(token.change24h)}
                            </div>
                        </div>
                        <div class="bg-[#0d0d12] p-4 rounded-lg">
                            <div class="text-sm text-gray-400 mb-1">Market Cap</div>
                            <div class="text-lg font-bold">${formatMarketCap(token.marketcap)}</div>
                        </div>
                        <div class="bg-[#0d0d12] p-4 rounded-lg">
                            <div class="text-sm text-gray-400 mb-1">Volume</div>
                            <div class="text-lg font-bold">${formatVolume(token.volume)}</div>
                        </div>
                        <div class="bg-[#0d0d12] p-4 rounded-lg">
                            <div class="text-sm text-gray-400 mb-1">Liquidity</div>
                            <div class="text-lg font-bold">${formatVolume(token.liquidity)}</div>
                        </div>
                        <div class="bg-[#0d0d12] p-4 rounded-lg">
                            <div class="text-sm text-gray-400 mb-1">Holders</div>
                            <div class="text-lg font-bold">${token.holders.toLocaleString()}</div>
                        </div>
                    </div>
                    
                    <div class="bg-[#0d0d12] p-4 rounded-lg mb-6">
                        <div class="text-sm text-gray-400 mb-2">Contract Address</div>
                        <div class="flex items-center justify-between bg-[#1a1a24] p-3 rounded">
                            <code class="text-sm font-mono">${token.contract}</code>
                            <button onclick="copyToClipboard('${token.contract}')" class="text-blue-500 hover:text-blue-400 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="bg-[#0d0d12] p-4 rounded-lg mb-6">
                        <div class="text-sm text-gray-400 mb-2">Created</div>
                        <div class="text-sm">${formatDate(token.created)} • ${token.created.toLocaleDateString()}</div>
                    </div>
                    
                    <div class="flex gap-3">
                        <button onclick="handleTrade(${token.id})" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition">
                            Trade Now
                        </button>
                        <button onclick="addToWatchlist(${token.id})" class="px-6 py-3 bg-[#1a1a24] hover:bg-[#252532] rounded-lg transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            
            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        // ==================== ACTIONS ====================
        function handleTrade(tokenId) {
            const token = state.tokens.find(t => t.id === tokenId);
            alert(`Trade ${token.name} (${token.symbol})\n\nThis would open the trading interface.`);
        }

        function addToWatchlist(tokenId) {
            const token = state.tokens.find(t => t.id === tokenId);
            alert(`Added ${token.name} to watchlist!`);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Contract address copied to clipboard!');
            });
        }

        // ==================== SEARCH ====================
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                state.searchQuery = e.target.value;
                applyFilters();
            }, 300);
        });

        // ==================== EVENT LISTENERS ====================
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                setFilter(tab.dataset.filter);
            });
        });

        document.querySelectorAll('[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                setSortField(th.dataset.sort);
            });
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (state.currentPage > 1) {
                state.currentPage--;
                renderTable();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            const maxPage = Math.ceil(state.filteredTokens.length / state.itemsPerPage);
            if (state.currentPage < maxPage) {
                state.currentPage++;
                renderTable();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ==================== INITIALIZATION ====================
        function showLoadingBar() {
            document.getElementById('loadingBar').style.display = 'block';
        }

        function hideLoadingBar() {
            document.getElementById('loadingBar').style.display = 'none';
        }

        function initialize() {
            showLoadingBar();
            
            // Simulate initial data load
            setTimeout(() => {
                initializeTokens();
                applyFilters();
                startWebSocketSimulation();
                state.isLoading = false;
                hideLoadingBar();
            }, 1000);
        }

        // Start the application
        initialize();
    </script>
</body>
</html>
